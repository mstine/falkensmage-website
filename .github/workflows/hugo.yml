# Deploy Hugo site to GitHub Pages
# Source: Official Hugo starter workflow pattern (D-06)
# Triggers: push to main, a nightly schedule (refreshes the CURRENTLY feed),
# and manual dispatch.

name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  # Nightly rebuild refreshes the feed-driven cards (Rewired's latest episode).
  # Feral Architecture is now local content and needs no refresh.
  # (GitHub cron is UTC and may drift/skip under load — fine for a daily refresh.)
  schedule:
    - cron: "0 9 * * *"   # ~03:00–04:00 America/Chicago
  workflow_dispatch:      # manual "rebuild now" button in the Actions tab
    inputs:
      send_email:
        description: "Send the newest essay to subscribers after deploy (otherwise a draft)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # No Dart Sass step: the arcaeon theme has zero .scss/.sass files and its
      # only CSS pipeline is css.Build (esbuild, bundled in Hugo Extended).
      # `sudo snap install dart-sass` was dead weight AND the flaky step that
      # broke the build ("error: cannot install dart-sass: too many requests"
      # — Snap Store rate-limiting). Removed. Re-add only if .scss is introduced.

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Gate: every legacy feralarchitecture.com/p/<slug> must have a /fa/ page
      # before anything deploys — a missing one is a silent 404 behind the redirect.
      - name: Validate Feral Architecture section
        run: bash tests/validate-fa.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          # Needed for public/.well-known/atproto-did (Bluesky domain handle).
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # After deploy, so an email can never link to a page that isn't live. Only a dispatch
  # with send_email sends; push and the nightly rebuild leave a draft, which keeps the
  # fallback from mailing subscribers outside the chosen hour.
  email:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Email the newest essay
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email }}
        run: python3 scripts/send-fa-email.py
